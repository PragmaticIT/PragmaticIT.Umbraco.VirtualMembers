name: Publish to NuGet

on:
  release:
    types: [published]   # uruchamia się gdy opublikujesz Release na GitHubie

jobs:
  publish:
    name: Pack & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Extract version from tag
        id: version
        # GitHub release tag powinien mieć format v1.2.3 lub 1.2.3
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --no-build --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: >
          dotnet pack Source/PragmaticIT.Umbraco.VirtualMembers/PragmaticIT.Umbraco.VirtualMembers.csproj
          --no-build
          --configuration Release
          /p:Version=${{ steps.version.outputs.VERSION }}
          --output nupkgs

      - name: Push to NuGet
        run: >
          dotnet nuget push nupkgs/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbols to NuGet
        run: >
          dotnet nuget push nupkgs/*.snupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        continue-on-error: true
